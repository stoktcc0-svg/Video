<!-- KODE SOCIAL BAR -->
<script data-cfasync="false" src="https://brijmohan.org/14/f4566885d8f2523c0ff29e6f7aabce85"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>
<style>
body{
    margin:0;
    background:#000;
}

video{
    width:100%;
    height:100vh;
    object-fit:contain;
    background:#000;
}

#title{
    position:absolute;
    top:10px;
    left:10px;
    color:#fff;
    font-size:14px;
}
</style>
</head>
<body>

<video
    id="player"
    controls
    playsinline
    controlsList="nodownload">
    <source src="" type="video/mp4">
</video>

<script>
/* =========================
   KONFIGURASI
========================= */

const JSON_URL = "videos.json";

/* SMART LINK */
const DIRECT_LINK =
"https://asiaso.org/4/72e0a845bfa4ab89f521a34e2fda898d";

/* SHOPEE */
const SHOPEE_LINK =
"https://s.shopee.co.id/2VrzPfIQbA";


const video = document.getElementById("player");

let clicked = false;
let redirected = false;


/* =========================
   PILIH IKLAN RANDOM
========================= */

function getRandomAd(){
    const ads = [
        DIRECT_LINK,
        SHOPEE_LINK
    ];

    const randomIndex =
        Math.floor(Math.random() * ads.length);

    return ads[randomIndex];
}


/* =========================
   REDIRECT RANDOM
========================= */

function redirectRandom(){
    if(redirected) return;

    redirected = true;

    const selectedAd = getRandomAd();

    window.location.href = selectedAd;
}


/* =========================
   AMBIL ID VIDEO DINAMIS
========================= */

const hash = window.location.hash;

const id = decodeURIComponent(
    hash.replace(/^#\/?/, '')
);


/* =========================
   LOAD VIDEOS.JSON
========================= */

fetch(JSON_URL)
.then(res => {
    if(!res.ok){
        throw new Error("Gagal mengambil videos.json");
    }
    return res.json();
})
.then(data => {
    const vids = data.videos;

    const selected =
        vids.find(v => v.id === id);

    if(!selected){
        document.body.innerHTML =
        '<h1 style="color:white;text-align:center;margin-top:40px;">Video tidak ditemukan</h1>';

        return;
    }

    video.src = selected.cdn;

})
.catch(error => {

    console.error(error);

    document.body.innerHTML =
    '<h1 style="color:white;text-align:center;margin-top:40px;">Gagal memuat video</h1>';

});


/* =========================
   KLIK VIDEO
========================= */

video.addEventListener("click", function(){

    /* KLIK PERTAMA */

    if(!clicked){

        clicked = true;

        return;
    }


    /* KLIK KEDUA DAN SETERUSNYA */

    redirectRandom();

});


/* =========================
   REDIRECT SETELAH 30 DETIK
========================= */

video.addEventListener("timeupdate", function(){

    if(
        !redirected &&
        video.currentTime >= 30
    ){

        redirectRandom();

    }

});

</script></body>
</html>
