<!DOCTYPE html>
<html lang="id">

gtag('js', new Date());

<!-- KODE SOCIAL BAR -->
<script data-cfasync="false" src="https://brijmohan.org/14/f4566885d8f2523c0ff29e6f7aabce85"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>
<style>
body{
    margin:0;
    background:#000;
    overflow:hidden;
    font-family: sans-serif;
}

.player-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

/* OVERLAY PESAN PETUNJUK (HILANG DALAM 3 DETIK) */
#noticeOverlay {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 500px;
    background: rgba(0, 0, 0, 0.85);
    border: 1px solid #ffcc00;
    color: #fff;
    padding: 12px 16px;
    border-radius: 8px;
    text-align: center;
    font-size: 13px;
    line-height: 1.4;
    z-index: 99;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    transition: opacity 0.5s ease;
    pointer-events: none;
}

/* NATIVE BANNER MELAYANG (FLOATING CONTAINER) */
#floatingNativeAd {
    position: absolute;
    bottom: 60px; /* Diatur agak ke atas agar tidak menutupi kontrol video */
    left: 50%;
    transform: translateX(-50%);
    width: 92%;
    max-width: 450px;
    background: rgba(20, 20, 20, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    padding: 8px;
    z-index: 98;
    box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* TOMBOL TUTUP NATIVE BANNER */
.close-native-btn {
    align-self: flex-end;
    background: #333;
    color: #fff;
    border: none;
    font-size: 12px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    cursor: pointer;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
}

.close-native-btn:hover {
    background: #e74c3c;
}

.native-ad-wrapper {
    width: 100%;
    overflow: hidden;
    text-align: center;
}
</style>
</head>
<body>

<div class="player-container">
    <!-- NOTIFIKASI PETUNJUK AWAL -->
    <div id="noticeOverlay">
        📌 <b>Petunjuk:</b> Jika dialihkan ke halaman iklan, tekan tombol <b>Kembali (Back)</b> pada HP/browser Anda untuk memutar video.
    </div>

    <!-- PEMUTAR VIDEO NATIVE -->
    <video
        id="player"
        controls
        playsinline
        preload="metadata"
        controlsList="nodownload">
        <source src="" type="video/mp4">
    </video>

    <!-- CONTAINER NATIVE BANNER MELAYANG -->
    <div id="floatingNativeAd">
        <button class="close-native-btn" onclick="closeNativeAd()" title="Tutup Iklan">✕</button>
        <div class="native-ad-wrapper">
            <!-- KODE NATIVE BANNER -->
            <script async="async" data-cfasync="false" src="https://brijmohan.org/21/888e5b3c9a14b57a890183ca1e7f232a"></script>
            <div id="container-888e5b3c9a14b57a890183ca1e7f232a"></div>
        </div>
    </div>
</div>

<script>
/* =========================
   FUNGSI TUTUP NATIVE BANNER
========================= */
function closeNativeAd() {
    const ad = document.getElementById("floatingNativeAd");
    if(ad) {
        ad.style.display = "none";
    }
}


/* =========================
   HILANGKAN PETUNJUK DALAM 3 DETIK
========================= */
setTimeout(() => {
    const notice = document.getElementById("noticeOverlay");
    if(notice) {
        notice.style.opacity = "0";
        setTimeout(() => {
            notice.style.display = "none";
        }, 500);
    }
}, 3000);


/* =========================
   KONFIGURASI
========================= */

const JSON_URL = "videos.json";

/* SMART LINK */
const DIRECT_LINK = "https://asiaso.org/4/72e0a845bfa4ab89f521a34e2fda898d";

/* SHOPEE */
const SHOPEE_LINK = "https://s.shopee.co.id/2VrzPfIQbA";

const video = document.getElementById("player");

let clicked = false;
let redirected = false;

/* =========================
   PILIH IKLAN RANDOM
========================= */
function getRandomAd(){
    const ads = [
        DIRECT_LINK,
        SHOPEE_LINK
    ];
    const randomIndex = Math.floor(Math.random() * ads.length);
    return ads[randomIndex];
}

/* =========================
   REDIRECT RANDOM
========================= */
function redirectRandom(){
    if(redirected) return;
    redirected = true;
    const selectedAd = getRandomAd();
    window.location.href = selectedAd;
}

/* =========================
   AMBIL ID VIDEO DINAMIS
========================= */
const hash = window.location.hash;
const id = decodeURIComponent(hash.replace(/^#\/?/, ''));

/* =========================
   LOAD VIDEOS.JSON
========================= */
fetch(JSON_URL)
.then(res => {
    if(!res.ok){
        throw new Error("Gagal mengambil videos.json");
    }
    return res.json();
})
.then(data => {
    const vids = data.videos;
    const selected = vids.find(v => v.id === id);

    if(!selected){
        document.body.innerHTML =
        '<h1 style="color:white;text-align:center;margin-top:40px;">Video tidak ditemukan</h1>';
        return;
    }

    video.src = selected.cdn;

    if(selected.poster) {
        video.poster = selected.poster;
    } else {
        video.src = selected.cdn + "#t=0.5";
    }
})
.catch(error => {
    console.error(error);
    document.body.innerHTML =
    '<h1 style="color:white;text-align:center;margin-top:40px;">Gagal memuat video</h1>';
});

/* =========================
   LOGIKA KLIK & REDIRECT
========================= */
video.addEventListener("click", function(){
    /* KLIK PERTAMA */
    if(!clicked){
        clicked = true;
        return;
    }

    /* KLIK KEDUA DAN SETERUSNYA REDIRECT */
    redirectRandom();
});

/* =========================
   REDIRECT SETELAH 30 DETIK
========================= */
video.addEventListener("timeupdate", function(){
    if(!redirected && video.currentTime >= 30){
        redirectRandom();
    }
});
</script>

</body>
</html>
