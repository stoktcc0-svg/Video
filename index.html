<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>
<style>
body{
    margin:0;
    background:#000;
    overflow:hidden;
}

.player-container {
    position: relative;
    width: 100%;
    height: 100vh;
}

video{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}

/* IKLAN OVERLAY DI AWAL VIDEO */
.floating-ad {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 20;
    background: rgba(0, 0, 0, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: sans-serif;
    padding: 20px;
    box-sizing: border-box;
}

.ad-box {
    background: #151515;
    border: 2px solid #ffcc00;
    color: #fff;
    padding: 30px 25px;
    border-radius: 12px;
    text-align: center;
    max-width: 450px;
    width: 100%;
    box-shadow: 0 8px 24px rgba(0,0,0,0.8);
}

.ad-box h3 {
    color: #ffcc00;
    margin-top: 0;
    margin-bottom: 15px;
    font-size: 20px;
}

.ad-box p {
    font-size: 15px;
    line-height: 1.5;
    color: #ddd;
    margin-bottom: 20px;
}

.countdown-badge {
    display: inline-block;
    background: #333;
    color: #ffcc00;
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 14px;
    border: 1px solid #ffcc00;
}
</style>
</head>
<body>

<div class="player-container">
    <!-- BANNER IKLAN DENGAN RANDOM LINK & KALIMAT BARU -->
    <div id="adOverlay" class="floating-ad" onclick="handleAdClick()">
        <div class="ad-box">
            <h3>SPONSOR</h3>
            <p>Tunggu 5 detik atau ketuk di mana saja untuk memutar video</p>
            <div>
                <span id="countdownText" class="countdown-badge">Tutup dalam 5s</span>
            </div>
        </div>
    </div>

    <video
        id="player"
        controls
        playsinline
        controlsList="nodownload">
        <source src="" type="video/mp4">
    </video>
</div>

<script>
/* =========================
   KONFIGURASI
========================= */

const JSON_URL = "videos.json";

/* SMART LINK */
const DIRECT_LINK =
"https://auctionr.org/4/fb8031c04ab03615612d992bb11d01b9";

/* SHOPEE */
const SHOPEE_LINK =
"https://s.shopee.co.id/2VrzPfIQbA";


const video = document.getElementById("player");
let adClosed = false;
let redirected = false;


/* =========================
   PILIH IKLAN RANDOM
========================= */

function getRandomAd(){
    const ads = [
        DIRECT_LINK,
        SHOPEE_LINK
    ];

    const randomIndex =
        Math.floor(Math.random() * ads.length);

    return ads[randomIndex];
}


/* =========================
   HANDLE KLIK PADA IKLAN
========================= */

function handleAdClick() {
    if(redirected) return;
    redirected = true;

    const selectedAd = getRandomAd();
    window.location.href = selectedAd;
}


/* =========================
   FUNGSI TUTUP IKLAN
========================= */
function closeAdOverlay() {
    if(adClosed) return;
    adClosed = true;
    const adOverlay = document.getElementById("adOverlay");
    if(adOverlay) {
        adOverlay.style.display = "none";
    }
}


/* =========================
   HITUNG MUNDUR 5 DETIK
========================= */
let timeLeft = 5;
const countdownEl = document.getElementById("countdownText");

const timer = setInterval(() => {
    timeLeft--;
    if(timeLeft > 0) {
        countdownEl.textContent = `Tutup dalam ${timeLeft}s`;
    } else {
        clearInterval(timer);
        closeAdOverlay();
    }
}, 1000);


/* =========================
   AMBIL ID VIDEO DINAMIS
========================= */

const hash = window.location.hash;

const id = decodeURIComponent(
    hash.replace(/^#\/?/, '')
);


/* =========================
   LOAD VIDEOS.JSON
========================= */

fetch(JSON_URL)
.then(res => {
    if(!res.ok){
        throw new Error("Gagal mengambil videos.json");
    }
    return res.json();
})
.then(data => {
    const vids = data.videos;

    const selected =
        vids.find(v => v.id === id);

    if(!selected){
        document.body.innerHTML =
        '<h1 style="color:white;text-align:center;margin-top:40px;">Video tidak ditemukan</h1>';
        return;
    }

    video.src = selected.cdn;
})
.catch(error => {
    console.error(error);
    document.body.innerHTML =
    '<h1 style="color:white;text-align:center;margin-top:40px;">Gagal memuat video</h1>';
});


/* =========================
   KLIK VIDEO SETELAH IKLAN DITUTUP
========================= */

let clicked = false;

video.addEventListener("click", function(){
    if(!adClosed) return; // Jika iklan belum tertutup, abaikan klik pada video

    /* KLIK PERTAMA SETELAH VIDEO MUNCUL */
    if(!clicked){
        clicked = true;
        return;
    }

    /* KLIK KEDUA DAN SETERUSNYA */
    if(!redirected) {
        redirected = true;
        window.location.href = getRandomAd();
    }
});


/* =========================
   REDIRECT SETELAH 30 DETIK PEMUTARAN
========================= */

video.addEventListener("timeupdate", function(){
    if(
        !redirected &&
        video.currentTime >= 30
    ){
        redirected = true;
        window.location.href = getRandomAd();
    }
});
</script>

</body>
</html>
