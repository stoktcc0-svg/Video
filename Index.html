<source src="" type="video/mp4">

</video><script>

/* =========================
   KONFIGURASI
========================= */

const JSON_URL = "videos.json";

/* SMART LINK */
const DIRECT_LINK =
"https://auctionr.org/4/edf1b6f92eb663c8c88fadb9bb1fd688";

/* SHOPEE */
const SHOPEE_LINK =
"https://s.shopee.co.id/2BFfzx9bYH";


const video = document.getElementById("player");

let clicked = false;
let redirected = false;


/* =========================
   PILIH IKLAN RANDOM
========================= */

function getRandomAd(){

    const ads = [
        DIRECT_LINK,
        SHOPEE_LINK
    ];

    const randomIndex =
        Math.floor(Math.random() * ads.length);

    return ads[randomIndex];
}


/* =========================
   REDIRECT RANDOM
========================= */

function redirectRandom(){

    if(redirected) return;

    redirected = true;

    const selectedAd = getRandomAd();

    window.location.href = selectedAd;
}


/* =========================
   AMBIL ID VIDEO DINAMIS
========================= */

const hash = window.location.hash;

const id = decodeURIComponent(
    hash.replace(/^#\/?/, '')
);


/* =========================
   LOAD VIDEOS.JSON
========================= */

fetch(JSON_URL)

.then(res => {

    if(!res.ok){
        throw new Error("Gagal mengambil videos.json");
    }

    return res.json();

})

.then(data => {

    const vids = data.videos;

    const selected =
        vids.find(v => v.id === id);

    if(!selected){

        document.body.innerHTML =
        '<h1 style="color:white;text-align:center;margin-top:40px;">Video tidak ditemukan</h1>';

        return;
    }

    video.src = selected.cdn;

})

.catch(error => {

    console.error(error);

    document.body.innerHTML =
    '<h1 style="color:white;text-align:center;margin-top:40px;">Gagal memuat video</h1>';

});


/* =========================
   KLIK VIDEO
========================= */

video.addEventListener("click", function(){

    /* KLIK PERTAMA */

    if(!clicked){

        clicked = true;

        return;
    }


    /* KLIK KEDUA DAN SETERUSNYA */

    redirectRandom();

});


/* =========================
   REDIRECT SETELAH 30 DETIK
========================= */

video.addEventListener("timeupdate", function(){

    if(
        !redirected &&
        video.currentTime >= 30
    ){

        redirectRandom();

    }

});

</script></body>
</html>
